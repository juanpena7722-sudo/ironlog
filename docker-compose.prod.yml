name: ironlog-prod

services:
  gateway:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv:ro
      - caddy-data:/data
    networks:
      - public
      - internal
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://ironlog:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/ironlog
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/v1/health']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ironlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ironlog
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ironlog -d ironlog']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  public:
  internal:
    internal: true

volumes:
  db-data:
  caddy-data:
